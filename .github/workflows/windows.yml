name: Build for Windows

on:
  # Enable manual run
  workflow_dispatch:
  push:
    tags:
      - "**"
    branches:
      - "**"
    paths:
      - .github/workflows/windows.yml
      - installers/desktop_inno_script.iss

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runs-on: windows-latest
            target: x64
            vc-redist: vc_redist.x64.exe
            # Passed to ISCC; a bare /D define (not /DNAME=value).
            inno-define: ""
          - runs-on: windows-11-arm
            target: arm64
            vc-redist: vc_redist.arm64.exe
            inno-define: /DSABER_ARM64
    name: Build for Windows (${{ matrix.arch.target }})
    runs-on: ${{ matrix.arch.runs-on }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/
            .flutter-plugins-dependencies
            build/
            linux/flutter/ephemeral/
            macos/Flutter/ephemeral/
            packages/**/.dart_tool/
            packages/**/.flutter-plugins-dependencies
            packages/**/pubspec.lock
            windows/flutter/ephemeral/
            ~/.dartServer/
            ~/.dart-tool/
          key: ${{ runner.OS }}-${{ matrix.arch.target }}-saber-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch.target }}-saber-

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Disable Flutter CLI animations
        shell: bash
        run: flutter config --no-cli-animations

      - run: ./patches/pre/remove_permission_handler.sh
        shell: bash

      # super_native_extensions builds a Rust library at build time.
      # The arm64 image ships Rust at %USERPROFILE%\.cargo\bin, which may
      # not be on PATH yet.
      - name: Ensure Rust is on PATH
        shell: bash
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo already on PATH"
          else
            echo "$USERPROFILE/.cargo/bin" >> $GITHUB_PATH
          fi

      # Resolve dependencies before patching the pub cache, and skip pub get
      # during the build so the patch below is not undone.
      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      # desktop_webview_window 0.3.2 only bundles the x64 WebView2 loader, so
      # the arm64 build fails to link. Patch it with the arm64 loader.
      - name: Patch WebView2 for arm64
        if: ${{ matrix.arch.target == 'arm64' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./patches/pre/patch_webview2_arm64.ps1

      - name: Build Windows
        shell: bash
        run: flutter build windows --no-pub

      - name: Download Visual C++ Redistributable
        shell: bash
        run: curl -L -o installers/${{ matrix.arch.vc-redist }} https://aka.ms/vs/17/release/${{ matrix.arch.vc-redist }}

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Build Windows Installer
        run: ISCC.exe ${{ matrix.arch.inno-define }} installers/desktop_inno_script.iss

      - name: Rename exe
        id: rename
        shell: bash
        run: |
          export LC_ALL=en_US.utf8
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          installerName="SaberInstaller_v${buildName}-${{ matrix.arch.target }}.exe"
          echo "installerName=$installerName" >> $GITHUB_OUTPUT

          mv installers/SaberInstaller-${{ matrix.arch.target }}.exe installers/$installerName

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Saber-Windows-${{ matrix.arch.target }}
          path: installers/${{ steps.rename.outputs.installerName }}

      - name: Upload to GitHub release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: installers/${{ steps.rename.outputs.installerName }}
